apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sigaint-website

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: sigaint-website
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

images:
  - name: sigaint-website
    newName: sigaint-website
    newTag: latest